<svg viewBox="0 0 1200 330" width="1200" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>

  <!-- ================= titles (centred on canvas centre x = 600) ================= -->
  <text x="600" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">How a question becomes an answer</text>
  <text x="600" y="52" text-anchor="middle" font-size="12.5" fill="#6b7280">DE Error Resolution Finder — 7-step RAG pipeline</text>

  <!--
    LAYOUT MATH
    box widths            : 140 + 186 + 150 + 152 + 168 + 166 = 962
    gaps (5 x 40)         : 200
    content width         : 1162  ->  side margin (1200 - 1162) / 2 = 19
    x-runs                : 19-159 | 199-385 | 425-575 | 615-767 | 807-975 | 1015-1181
    centre line           : y = 150   (all arrows sit exactly on this axis)
    normal box height 76  : y = 112 - 188
    tall  box height 108  : y =  96 - 204   (same centre, y = 150)
  -->

  <!-- 0. Your question : 19-159, centre x = 89 -->
  <rect x="19" y="112" width="140" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="89" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Your question</text>
  <text x="89" y="163" text-anchor="middle" font-size="10.5" fill="#64748b">plain text, typed in</text>

  <line x1="159" y1="150" x2="199" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1-3. Search : 199-385, centre x = 292 -->
  <rect x="199" y="96" width="186" height="108" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="292" y="117" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">1-3. Search</text>
  <text x="292" y="137" text-anchor="middle" font-size="10.5" fill="#1e40af">embed the question</text>
  <text x="292" y="154" text-anchor="middle" font-size="10.5" fill="#1e40af">exact-word search</text>
  <text x="292" y="171" text-anchor="middle" font-size="10.5" fill="#1e40af">meaning-based search</text>
  <text x="292" y="190" text-anchor="middle" font-size="9.5" fill="#3b82f6">(both run every time)</text>

  <line x1="385" y1="150" x2="425" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Fuse : 425-575, centre x = 500 -->
  <rect x="425" y="112" width="150" height="76" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">4. Fuse (RRF)</text>
  <text x="500" y="163" text-anchor="middle" font-size="10.5" fill="#92400e">one ranked list, k=60</text>

  <line x1="575" y1="150" x2="615" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Write answer : 615-767, centre x = 691 -->
  <rect x="615" y="112" width="152" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="691" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">5. Write answer</text>
  <text x="691" y="163" text-anchor="middle" font-size="9.5" fill="#166534">local / DeepSeek / OpenAI</text>

  <line x1="767" y1="150" x2="807" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Self-check : 807-975, centre x = 891 -->
  <rect x="807" y="112" width="168" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="891" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">6. Self-check</text>
  <text x="891" y="163" text-anchor="middle" font-size="10" fill="#5b21b6">2nd AI pass reviews draft</text>

  <line x1="975" y1="150" x2="1015" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final answer : 1015-1181, centre x = 1098 -->
  <rect x="1015" y="112" width="166" height="76" rx="10" fill="#0f172a"/>
  <text x="1098" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Final answer</text>
  <text x="1098" y="163" text-anchor="middle" font-size="9.5" fill="#cbd5e1">+ sources + logged trace</text>

  <!-- 7. Repair : same x-run as Self-check (807-975), centre x = 891, y = 240-310 -->
  <rect x="807" y="240" width="168" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="891" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">7. Repair</text>
  <text x="891" y="288" text-anchor="middle" font-size="9.5" fill="#991b1b">only if step 6 found an issue</text>

  <!-- self-check bottom edge (891,188) -> repair top edge (891,240) -->
  <line x1="891" y1="188" x2="891" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="899" y="218" font-size="10" fill="#991b1b">issue found</text>

  <!-- repair right edge (975,275) -> final-answer bottom edge (1098,188) -->
  <path d="M 975 275 H 1078 Q 1098 275 1098 255 V 188" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="983" y="266" font-size="10" fill="#991b1b">rewritten answer</text>
</svg>
